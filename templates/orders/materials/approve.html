<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>物资审批与入库</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body { padding: 15px; background-color: #f2f2f2; }
        .layui-card { box-shadow: 0 1px 2px 0 rgba(0,0,0,.05); }
    </style>
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">物资管理控制台</div>
        <div class="layui-card-body">
            
            <!-- 搜索筛选栏 -->
            <form class="layui-form layui-form-pane" action="">
                <div class="layui-form-item">
                    
                    <!-- 1. 状态筛选 -->
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0" selected>待审批</option>
                                <option value="1">已批准(待入库)</option>
                                <option value="2">已驳回</option>
                                <option value="3">已入库</option>
                            </select>
                        </div>
                    </div>

                    <!-- 2. 时间范围 -->
                    <div class="layui-inline">
                        <label class="layui-form-label">申请时间</label>
                        <div class="layui-input-inline" style="width: 200px;">
                            <input type="text" class="layui-input" id="dateRange" name="date_range" placeholder="开始 - 结束">
                        </div>
                    </div>

                    <!-- 3. 管理员专属筛选 (医院/科室) -->
                    <!-- 只有具备审批权限的人才显示高级筛选 -->
                    {% if is_purchaser %}
                    <div class="layui-inline">
                        <label class="layui-form-label">所属医院</label>
                        <div class="layui-input-inline">
                            <!-- 权限判断：超管(>=90)可选，院管/采购(<90)锁定 -->
                            <select name="search_hospital" lay-filter="search_hospital" id="searchHospital"
                                    {% if current_level < 90 %}disabled{% endif %}>
                                <option value="">全部医院</option>
                                {% for h in hospitals %}
                                <option value="{{ h.id_hospital }}" {% if current_level < 90 %}selected{% endif %}>
                                    {{ h.hospital_name }}
                                </option>
                                {% endfor %}
                            </select>
                            
                            <!-- 锁定时的隐藏域 -->
                            {% if current_level < 90 %}
                            <input type="hidden" name="search_hospital" value="{{ user.id_hospital }}">
                            {% endif %}
                        </div>
                    </div>
                    
                    <div class="layui-inline">
                        <label class="layui-form-label">申请科室</label>
                        <div class="layui-input-inline">
                            <select name="search_dept" id="searchDept" lay-search>
                                <option value="">全部科室</option>
                                {% for d in departments %}
                                <option value="{{ d.id_department }}">{{ d.department_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    {% endif %}

                    <!-- 按钮 -->
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-normal" lay-submit lay-filter="data-search-btn">
                            <i class="layui-icon"></i> 查询
                        </button>
                        <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                    </div>
                </div>
            </form>

            <!-- 数据表格 -->
            <table class="layui-hide" id="approveTable" lay-filter="approveTable"></table>

        </div>
    </div>
</div>

<!-- 入库弹窗表单模板 (隐藏) -->
<div id="stockInForm" style="display: none; padding: 20px;">
    <form class="layui-form" lay-filter="stockInFormFilter">
        <div class="layui-form-item">
            <label class="layui-form-label">物资名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">申请数量</label>
            <div class="layui-input-block">
                <input type="text" name="apply_qty" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <hr>
        <div class="layui-form-item">
            <label class="layui-form-label" style="color:red; font-weight:bold;">实收数量</label>
            <div class="layui-input-block">
                <input type="number" name="actual_qty" required lay-verify="required|number" placeholder="请输入实际入库数量" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="color:red; font-weight:bold;">入库单价</label>
            <div class="layui-input-block">
                <input type="number" name="actual_price" required lay-verify="required|number" placeholder="请输入实际采购单价" class="layui-input">
            </div>
        </div>
    </form>
</div>

<script src="/static/layui/layui.js"></script>
<script>
    // 后端传入的变量
    var IS_PURCHASER = {{ 'true' if is_purchaser else 'false' }};
    var CURRENT_LEVEL = {{ current_level }};
    var USER_HOSPITAL_ID = "{{ user.id_hospital }}";

    layui.use(['table', 'layer', 'jquery', 'form', 'laydate'], function(){
        var table = layui.table,
            layer = layui.layer,
            $ = layui.jquery,
            form = layui.form,
            laydate = layui.laydate;

        laydate.render({ elem: '#dateRange', range: true });

        // 科室联动加载
        function loadDept(selector, hospitalId){
            var $sel = $(selector);
            $sel.empty();
            if(!hospitalId){ $sel.append('<option value="">全部科室</option>'); form.render('select'); return; }
            
            $.getJSON('/system/api/get_depts_by_hospital', {id_hospital: hospitalId}, function(res){
                $sel.append('<option value="">全部科室</option>');
                if(res.code === 0){
                    $.each(res.data, function(i, d){
                        $sel.append('<option value="'+d.id_department+'">'+d.department_name+'</option>');
                    });
                }
                form.render('select');
            });
        }

        // 监听医院选择 (仅超管可用)
        form.on('select(search_hospital)', function(data){ 
            if(CURRENT_LEVEL >= 90) {
                loadDept('#searchDept', data.value); 
            }
        });

        // 渲染表格
        var tableIns = table.render({
            elem: '#approveTable',
            url: '/materials/api/request_list',
            // 初始参数: 如果是院管/采购(<90)，强制查本院; 且默认显示待审批(0)
            where: { 
                status: '0',
                search_hospital: (CURRENT_LEVEL < 90) ? USER_HOSPITAL_ID : '' 
            },
            cols: [[
                {field:'id', width:60, title: 'ID', sort: true},
                {field:'status', width:100, title: '状态', align:'center', templet: function(d){
                    if(d.status == 0) return '<span class="layui-badge layui-bg-blue">待审批</span>';
                    if(d.status == 1) return '<span class="layui-badge layui-bg-orange">待入库</span>'; 
                    if(d.status == 2) return '<span class="layui-badge">已驳回</span>';
                    if(d.status == 3) return '<span class="layui-badge layui-bg-green">已入库</span>';
                    return '';
                }},
                {field:'material_name', title:'物资名称', minWidth:140},
                {field:'spec', title:'规格', width:100},
                {field:'model', title:'型号', width:100},
                {field:'apply_qty', title:'申请数', width:90, align:'center', templet: function(d){
                    return d.apply_qty + ' ' + (d.unit||'');
                }},
                {field:'estimated_price', title:'预估单价', width:90, align:'right'},
                {field:'applicant', title:'申请人', width:90},
                {field:'dept_name', title:'请购部门', width:120},
                {field:'reason', title:'请购原因', width:150},
                {field:'created_at', title:'申请时间', width:160, sort: true},
                // 操作列
                {fixed: 'right', title:'操作', width:150, align:'center', templet: function(d){
                    // 1. 待审批 -> 批准/驳回
                    if(IS_PURCHASER && d.status == 0){
                        return '<a class="layui-btn layui-btn-xs" lay-event="pass">批准</a>' +
                               '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="reject">驳回</a>';
                    }
                    // 2. 已批准 -> 入库
                    else if(IS_PURCHASER && d.status == 1){
                        return '<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="stock_in"><i class="layui-icon layui-icon-cart"></i> 入库</a>';
                    }
                    // 3. 已入库/已驳回 -> 仅显示状态
                    else if(d.status == 3){
                        return '<span style="color:#5fb878;">已入库</span>';
                    }
                    else if(d.status == 2){
                        return '<span style="color:#ff5722;">已驳回</span>';
                    }
                    else if(d.approver) {
                        return '<span style="color:#ccc;">处理人:' + d.approver + '</span>';
                    }
                    return '-';
                }}
            ]],
            page: true,
            limits: [10, 20, 50],
            limit: 15
        });

        // 搜索提交
        form.on('submit(data-search-btn)', function (data) {
            var field = data.field;
            
            // 兼容性处理：如果下拉框被 disabled，Layui 不会提交该字段
            // 需要从隐藏域或手动补充
            if(CURRENT_LEVEL < 90) {
                field.search_hospital = USER_HOSPITAL_ID;
            }
            
            tableIns.reload({ page: { curr: 1 }, where: field });
            return false;
        });

        // 重置
        $('#btnReset').click(function(){
            // 重置表单元素
            $('#dateRange').val('');
            $('select[name="status"]').val('0'); // 默认重置回待审批
            
            // 如果是院管/采购，下拉框锁定不动；如果是超管，重置下拉框
            if(CURRENT_LEVEL >= 90){
                $('select[name="search_hospital"]').val('');
                $('#searchDept').empty().append('<option value="">全部科室</option>');
            } else {
                // 院管/采购：仅重置科室
                $('select[name="search_dept"]').val('');
            }
            
            form.render('select');
            
            // 触发搜索
            $('[lay-filter="data-search-btn"]').click();
        });

        // 工具条监听
        table.on('tool(approveTable)', function(obj){
            var data = obj.data;
            
            // --- 批准 ---
            if(obj.event === 'pass'){
                layer.confirm('确认批准该申请？<br><span style="color:#ff5722;font-size:12px;">批准后将进入[待入库]状态，需实际采购到货后再次操作入库。</span>', {icon: 3, title:'审批确认'}, function(index){
                    $.post('/materials/api/approve', {id: data.id, action: 'pass'}, function(res){
                        if(res.code===0){ 
                            layer.msg('已批准');
                            tableIns.reload();
                        } else { 
                            layer.msg(res.msg, {icon: 2}); 
                        }
                    });
                    layer.close(index);
                });
            } 
            // --- 驳回 ---
            else if(obj.event === 'reject'){
                layer.prompt({title: '请输入驳回原因', formType: 2}, function(value, index){
                    $.post('/materials/api/approve', {id: data.id, action: 'reject', reason: value}, function(res){
                        if(res.code===0){ 
                            layer.msg('已驳回');
                            tableIns.reload();
                        } else { 
                            layer.msg(res.msg, {icon: 2}); 
                        }
                    });
                    layer.close(index);
                });
            }
            // --- 入库 ---
            else if(obj.event === 'stock_in'){
                // 1. 初始化表单值
                form.val("stockInFormFilter", {
                    "name": data.material_name + " (" + (data.spec||'-') + ")",
                    "apply_qty": data.apply_qty + " " + (data.unit||''),
                    "actual_qty": data.apply_qty, // 默认实收=申请
                    "actual_price": data.estimated_price // 默认单价=预估
                });

                // 2. 弹出层
                layer.open({
                    type: 1,
                    title: '物资入库登记',
                    area: ['450px', '400px'],
                    content: $('#stockInForm'),
                    btn: ['确认入库', '取消'],
                    yes: function(index, layero){
                        // 获取弹窗内的表单数据
                        var actualQty = $('input[name="actual_qty"]').val();
                        var actualPrice = $('input[name="actual_price"]').val();

                        if(!actualQty || !actualPrice){
                            layer.msg('请填写完整的实收数量和入库单价', {icon: 5, anim: 6});
                            return;
                        }

                        // 提交
                        $.post('/materials/api/stock_in', {
                            id: data.id,
                            actual_qty: actualQty,
                            actual_price: actualPrice
                        }, function(res){
                            if(res.code === 0){
                                layer.msg('入库成功', {icon: 1});
                                layer.close(index);
                                tableIns.reload(); 
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        });
                    },
                    success: function(){
                        $('input[name="actual_price"]').focus();
                    }
                });
            }
        });

    });
</script>
</body>
</html>
