<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>排班管理系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- 引入 Layui -->
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
    <!-- 引入 FullCalendar -->
    <link href='/static/fullcalendar/main.min.css' rel='stylesheet' />
    
    <style>
        body { padding: 15px; background-color: #f2f2f2; height: 100vh; box-sizing: border-box; }
        .layout-container { display: flex; height: 100%; gap: 15px; }
        .sidebar-panel { width: 280px; background: #fff; padding: 15px; border-radius: 4px; display: flex; flex-direction: column; }
        .calendar-panel { flex: 1; background: #fff; padding: 15px; border-radius: 4px; overflow: hidden; }
        
        /* 班次图例样式 */
        .shift-legend-item {
            padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; color: #fff; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* FullCalendar 微调 */
        #calendar { height: 100%; }
        .fc-event { cursor: pointer; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .fc-day-today { background-color: #f8faff !important; }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- 左侧：筛选与图例 -->
    <div class="sidebar-panel">
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 0;"><legend>筛选</legend></fieldset>
        
        <form class="layui-form">
            <div class="layui-form-item">
                <select name="filter_hospital" lay-filter="hospitalFilter">
                    {% for h in hospitals %}
                    <option value="{{ h.id_hospital }}">{{ h.hospital_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="layui-form-item">
                <select name="filter_dept" id="filter_dept" lay-filter="deptFilter">
                    <option value="">全部科室</option>
                    {% for d in departments %}
                    <option value="{{ d.id_department }}">{{ d.department_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>

        <hr>
        <fieldset class="layui-elem-field layui-field-title"><legend>班次图例</legend></fieldset>
        
        <!-- 动态加载的班次列表容器 -->
        <div id="shift-legend-container" style="flex:1; overflow-y:auto;">
            <!-- JS 插入内容 -->
        </div>

        <button class="layui-btn layui-btn-fluid layui-btn-primary layui-border-green" id="btn-manage-rules">
            <i class="layui-icon layui-icon-set"></i> 班次定义管理
        </button>
    </div>

    <!-- 右侧：日历 -->
    <div class="calendar-panel">
        <div id="calendar"></div>
    </div>
</div>

<!-- ================= TEMPLATE 1: 新增/编辑 排班 ================= -->
<script type="text/html" id="scheduleFormTpl">
    <form class="layui-form" lay-filter="scheduleForm" style="padding: 20px;">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">日期</label>
            <div class="layui-input-block">
                <input type="text" name="work_date" class="layui-input" readonly>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">班次</label>
            <div class="layui-input-block">
                <!-- 动态渲染 -->
                <select name="id_shift_rule" id="form_shift_select" lay-verify="required">
                    <option value="">加载中...</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">人员</label>
            <div class="layui-input-block">
                <input type="text" name="staff_name" lay-verify="required" placeholder="请输入姓名" class="layui-input">
                <!-- 实际项目中建议使用 select + lay-search 或 xm-select -->
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item text-right" style="text-align: right;">
            <button class="layui-btn layui-btn-danger layui-hide" type="button" id="btn-del-schedule">删除</button>
            <button class="layui-btn" lay-submit lay-filter="saveSchedule">保存</button>
        </div>
    </form>
</script>

<!-- ================= TEMPLATE 2: 班次规则管理 (列表+新增) ================= -->
<script type="text/html" id="ruleManagerTpl">
    <div style="padding: 15px;">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm layui-btn-normal" id="btn-add-rule">
                <i class="layui-icon layui-icon-add-1"></i> 新增规则
            </button>
        </div>
        <table id="ruleTable" lay-filter="ruleTable"></table>
    </div>
</script>

<!-- ================= TEMPLATE 3: 班次规则表单 (弹窗内中弹窗) ================= -->
<script type="text/html" id="ruleFormTpl">
    <form class="layui-form" lay-filter="ruleForm" style="padding: 20px;">
        <input type="hidden" name="id_shift_rule">
        <div class="layui-form-item">
            <label class="layui-form-label">名称</label>
            <div class="layui-input-block"><input type="text" name="shift_name" required class="layui-input"></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">开始</label>
                <div class="layui-input-inline" style="width: 100px;">
                    <input type="text" name="start_time" class="layui-input" id="time-start" placeholder="08:00">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">结束</label>
                <div class="layui-input-inline" style="width: 100px;">
                    <input type="text" name="end_time" class="layui-input" id="time-end" placeholder="16:00">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">颜色</label>
            <div class="layui-input-block">
                <div id="color-picker"></div>
                <input type="hidden" name="color" id="input-color">
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-submit lay-filter="saveRule">保存</button>
        </div>
    </form>
</script>


<script src="/static/layui/layui.js"></script>
<script src='/static/fullcalendar/main.min.js'></script>
<script src='/static/fullcalendar/zh-cn.js'></script>

<script>
    // 全局变量缓存班次规则，避免每次打开弹窗都请求
    var globalShiftRules = [];

    layui.use(['layer', 'form', 'table', 'colorpicker', 'laydate'], function(){
        var layer = layui.layer,
            form = layui.form,
            table = layui.table,
            $ = layui.$,
            colorpicker = layui.colorpicker,
            laydate = layui.laydate;
        
        var calendar; // Calendar 实例

        // =========================================================
        // 1. 核心功能：加载班次规则 & 渲染侧边栏
        // =========================================================
        function loadShiftRules(callback) {
            var hospitalId = $('select[name="filter_hospital"]').val();
            $.get('/workorders/api/shift_rule/list', {hospital_id: hospitalId}, function(res){
                if(res.code === 0){
                    globalShiftRules = res.data; // 更新缓存
                    renderSidebarLegend();      // 更新左侧图例
                    if(callback) callback();
                }
            });
        }

        function renderSidebarLegend() {
            var html = '';
            if(globalShiftRules.length === 0) {
                html = '<div class="layui-text layui-word-aux" style="text-align:center;">暂无班次定义</div>';
            } else {
                layui.each(globalShiftRules, function(index, item){
                    html += `
                        <div class="shift-legend-item" style="background-color: ${item.color};">
                            <span>${item.shift_name}</span>
                            <span>${item.start_time}-${item.end_time}</span>
                        </div>
                    `;
                });
            }
            $('#shift-legend-container').html(html);
        }

        // =========================================================
        // 2. 初始化 FullCalendar
        // =========================================================
        function initCalendar() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-cn',
                initialView: 'dayGridMonth',
                height: '100%',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                // 事件数据源 (后端 API)
                events: function(fetchInfo, successCallback, failureCallback) {
                    $.ajax({
                        url: '/workorders/api/schedule/list',
                        dataType: 'json',
                        data: {
                            start: fetchInfo.startStr,
                            end: fetchInfo.endStr,
                            hospital_id: $('select[name="filter_hospital"]').val(),
                            dept_id: $('#filter_dept').val()
                        },
                        success: function(res) {
                            if(res.code === 0) successCallback(res.data);
                            else failureCallback(res.msg);
                        }
                    });
                },
                // 点击日期 -> 新增
                dateClick: function(info) {
                    openScheduleModal(null, info.dateStr);
                },
                // 点击事件 -> 编辑
                eventClick: function(info) {
                    openScheduleModal(info.event);
                }
            });
            calendar.render();
        }

        // =========================================================
        // 3. 弹窗逻辑：新增/编辑 排班
        // =========================================================
        function openScheduleModal(eventObj, dateStr) {
            var isEdit = !!eventObj;
            var data = {};
            
            if(isEdit) {
                // 从 FullCalendar event 对象提取数据
                var props = eventObj.extendedProps;
                data = {
                    id: eventObj.id,
                    work_date: eventObj.startStr.split('T')[0], // 截取日期
                    id_shift_rule: props.id_shift_rule,
                    staff_name: props.staff_name,
                    remark: props.remark
                };
            } else {
                data = { id: '', work_date: dateStr, id_shift_rule: '', staff_name: '', remark: '' };
            }

            layer.open({
                type: 1,
                title: isEdit ? '编辑排班' : '新增排班',
                area: ['450px', '450px'],
                content: $('#scheduleFormTpl').html(),
                success: function(layero, index){
                    // 1. 动态生成下拉框选项
                    var selectHtml = '<option value="">请选择班次</option>';
                    layui.each(globalShiftRules, function(i, item){
                        selectHtml += `<option value="${item.id_shift_rule}">${item.shift_name} (${item.start_time}-${item.end_time})</option>`;
                    });
                    layero.find('#form_shift_select').html(selectHtml);
                    
                    // 2. 赋值表单
                    form.val("scheduleForm", data);
                    form.render(); // 刷新渲染

                    // 3. 删除按钮逻辑
                    if(isEdit){
                        layero.find('#btn-del-schedule').removeClass('layui-hide').click(function(){
                            layer.confirm('确认删除？', function(i){
                                $.post('/workorders/api/schedule/delete', {id: data.id}, function(res){
                                    layer.closeAll();
                                    layer.msg(res.msg);
                                    calendar.refetchEvents();
                                });
                            });
                        });
                    }

                    // 4. 保存提交
                    form.on('submit(saveSchedule)', function(formData){
                        $.post('/workorders/api/schedule/save', formData.field, function(res){
                            if(res.code === 0){
                                layer.close(index);
                                layer.msg('保存成功');
                                calendar.refetchEvents(); // 刷新日历
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        });
                        return false;
                    });
                }
            });
        }

        // =========================================================
        // 4. 弹窗逻辑：班次规则管理 (CRUD)
        // =========================================================
        $('#btn-manage-rules').click(function(){
            layer.open({
                type: 1,
                title: '班次定义管理',
                area: ['700px', '500px'],
                content: $('#ruleManagerTpl').html(),
                success: function(layero, index){
                    // 渲染表格
                    var tableIns = table.render({
                        elem: layero.find('#ruleTable'),
                        data: globalShiftRules, // 直接使用缓存数据，或者配置 url
                        cols: [[
                            {field: 'shift_name', title: '名称', width: 120},
                            {field: 'start_time', title: '开始', width: 100},
                            {field: 'end_time', title: '结束', width: 100},
                            {field: 'color', title: '颜色', templet: function(d){
                                return `<div style="width:20px;height:20px;background:${d.color}"></div>`;
                            }},
                            {title: '操作', width: 150, align:'center', templet: function(d){
                                return `
                                    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
                                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
                                `;
                            }}
                        ]]
                    });

                    // 监听工具条
                    table.on('tool(ruleTable)', function(obj){
                        if(obj.event === 'del'){
                            layer.confirm('确认删除此规则？已排班的历史数据可能受影响。', function(i){
                                $.post('/workorders/api/shift_rule/delete', {id: obj.data.id_shift_rule}, function(){
                                    loadShiftRules(function(){
                                        tableIns.reload({data: globalShiftRules}); // 刷新表格
                                        calendar.refetchEvents(); // 刷新日历
                                    });
                                    layer.close(i);
                                });
                            });
                        } else if(obj.event === 'edit'){
                            openRuleForm(obj.data, tableIns);
                        }
                    });

                    // 新增按钮
                    layero.find('#btn-add-rule').click(function(){
                        openRuleForm({}, tableIns);
                    });
                }
            });
        });

        // 打开单条规则编辑/新增表单
        function openRuleForm(data, tableIns) {
            layer.open({
                type: 1,
                title: data.id_shift_rule ? '编辑规则' : '新增规则',
                area: ['400px', '400px'],
                content: $('#ruleFormTpl').html(),
                success: function(layero, index){
                    form.val("ruleForm", data);
                    
                    // 颜色选择器
                    colorpicker.render({
                        elem: '#color-picker',
                        color: data.color || '#1E9FFF',
                        done: function(color){
                            $('#input-color').val(color);
                        }
                    });
                    $('#input-color').val(data.color || '#1E9FFF'); // 初始化 hidden input

                    // 时间选择器
                    laydate.render({elem: '#time-start', type: 'time', format:'HH:mm'});
                    laydate.render({elem: '#time-end', type: 'time', format:'HH:mm'});

                    form.on('submit(saveRule)', function(formData){
                        // 注入当前医院ID
                        formData.field.hospital_id = $('select[name="filter_hospital"]').val();
                        
                        $.post('/workorders/api/shift_rule/save', formData.field, function(res){
                            layer.close(index);
                            layer.msg('规则已保存');
                            // 保存后，重新加载全局规则，并刷新所有视图
                            loadShiftRules(function(){
                                tableIns.reload({data: globalShiftRules});
                                calendar.refetchEvents();
                            });
                        });
                        return false;
                    });
                }
            });
        }

        // =========================================================
        // 5. 启动逻辑
        // =========================================================
        
        // 筛选监听
        form.on('select(hospitalFilter)', function(data){
            loadShiftRules(); // 切换医院，规则也会变
            calendar.refetchEvents();
        });
        form.on('select(deptFilter)', function(data){
            calendar.refetchEvents();
        });

        // 初始化
        loadShiftRules(function(){
            initCalendar(); // 规则加载完再渲染日历，体验更好
        });

    });
</script>

</body>
</html>
