<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>任务类型管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body { padding: 20px; background-color: #f2f2f2; }
        .layui-card { box-shadow: 0 1px 2px 0 rgba(0,0,0,.05); }
    </style>
</head>
<body>

<div class="layui-card">
    <div class="layui-card-body">
        <!-- 搜索栏 -->
        <div style="padding-bottom: 10px;">
            <div class="layui-inline">
                <input class="layui-input" name="searchKeyword" id="searchKeyword" autocomplete="off" placeholder="输入名称或关键词搜索">
            </div>
            <button class="layui-btn" data-type="reload" id="btnSearch">搜索</button>
        </div>

        <!-- 数据表格 -->
        <table id="taskTypeTable" lay-filter="taskTypeTable"></table>
    </div>
</div>

<!-- 头部工具栏模板 -->
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> 新增类型
        </button>
    </div>
</script>

<!-- 行工具栏模板 -->
<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<!-- 弹窗表单 (新增/编辑) -->
<div id="formLayer" style="display:none; padding: 20px;">
    <form class="layui-form" lay-filter="dataForm">
        <!-- 隐藏域存储ID -->
        <input type="hidden" name="id">
        
        <div class="layui-form-item">
            <label class="layui-form-label">任务名称</label>
            <div class="layui-input-block">
                <input type="text" name="task_name" required lay-verify="required" placeholder="请输入任务名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">描述</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入任务描述" class="layui-textarea"></textarea>
            </div>
        </div>
        
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">积分分值</label>
                <div class="layui-input-inline">
                    <input type="number" name="score" required lay-verify="required|number" placeholder="0" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">基准耗时</label>
                <div class="layui-input-inline">
                    <input type="number" name="baseline_time" required lay-verify="required|number" placeholder="分钟" autocomplete="off" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">分钟</div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">关键词</label>
            <div class="layui-input-block">
                <input type="text" name="key_word" placeholder="用于AI匹配，逗号分隔" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item" style="text-align: right;">
            <button class="layui-btn" lay-submit lay-filter="submitForm">立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </form>
</div>

<script src="/static/layui/layui.js"></script>
<script>
layui.use(['table', 'form', 'layer', 'jquery'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.jquery;

    // 1. 渲染表格
    var tableIns = table.render({
        elem: '#taskTypeTable',
        url: '/orders/task_type/list', // 对应后端 list 接口
        toolbar: '#toolbarDemo',
        defaultToolbar: ['filter', 'print', 'exports'],
        cols: [[
            {field: 'id', title: 'ID', width: 80, sort: true, fixed: 'left'},
            {field: 'task_name', title: '任务名称', width: 150},
            {field: 'description', title: '描述', width: 400},
            {field: 'score', title: '积分', width: 80, sort: true},
            {field: 'baseline_time', title: '基准耗时(分)', width: 120, sort: true},
            {field: 'key_word', title: '关键词', width: 150},
            {fixed: 'right', title:'操作', toolbar: '#barDemo', width: 130}
        ]],
        page: true, // 开启分页
        limit: 50,
        limits: [10, 20, 50]
    });

    // 2. 搜索重载
    $('#btnSearch').on('click', function(){
        var keyword = $('#searchKeyword').val();
        tableIns.reload({
            where: { keyword: keyword },
            page: { curr: 1 }
        });
    });

    // 3. 头部工具栏事件 (新增)
    table.on('toolbar(taskTypeTable)', function(obj){
        if(obj.event === 'add'){
            openForm('add');
        }
    });

    // 4. 行工具栏事件 (编辑/删除)
    table.on('tool(taskTypeTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('真的要删除【' + data.task_name + '】吗？', function(index){
                $.post('/orders/task_type/del', {id: data.id}, function(res){
                    if(res.code === 0){
                        obj.del();
                        layer.msg('删除成功', {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                });
                layer.close(index);
            });
        } else if(obj.event === 'edit'){
            openForm('edit', data);
        }
    });

    // 5. 打开表单弹窗函数
    var popupIndex;
    function openForm(type, data) {
        // 重置表单
        document.querySelector('.layui-form[lay-filter="dataForm"]').reset();
        $('input[name="id"]').val(''); // 清空ID

        var title = (type === 'add') ? '新增任务类型' : '编辑任务类型';
        
        popupIndex = layer.open({
            type: 1,
            title: title,
            area: ['500px', '450px'],
            content: $('#formLayer'),
            success: function(layero, index){
                if(type === 'edit' && data){
                    // 表单赋值
                    form.val("dataForm", data);
                }
            }
        });
    }

    // 6. 表单提交监听
    form.on('submit(submitForm)', function(data){
        var field = data.field;
        var url = field.id ? '/orders/task_type/edit' : '/orders/task_type/add';

        $.post(url, field, function(res){
            if(res.code === 0){
                layer.msg(res.msg, {icon: 1});
                layer.close(popupIndex);
                tableIns.reload(); // 重载表格
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        });
        return false; // 阻止表单跳转
    });

});
</script>

</body>
</html>
