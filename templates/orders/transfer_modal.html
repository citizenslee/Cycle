<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>工单转交</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body { padding: 20px; background-color: #fff; }
        .layui-form-item { margin-bottom: 20px; }
        .tips { color: #999; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" lay-filter="transfer-form">
        <input type="hidden" name="work_id" value="{{ work_id }}">

        <!-- 当前科室 -->
        <div class="layui-form-item">
            <label class="layui-form-label">当前受理</label>
            <div class="layui-input-block">
                <input type="text" value="{{ current_dept_name }}" disabled class="layui-input layui-disabled">
            </div>
        </div>

        <!-- 目标科室选择 -->
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:red">*</span> 转交给</label>
            <div class="layui-input-block">
                <select name="target_dept_id" lay-verify="required" lay-search>
                    <option value="">请搜索或选择目标科室</option>
                    {% if candidates %}
                        {% for dept in candidates %}
                            <option value="{{ dept.id_department }}">{{ dept.department_name }}</option>
                        {% endfor %}
                    {% else %}
                        <option value="" disabled>本院暂无其他职能科室</option>
                    {% endif %}
                </select>
                <div class="tips">仅显示本院其他职能/维修科室</div>
            </div>
        </div>

        <!-- 转单原因 -->
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label"><span style="color:red">*</span> 转单原因</label>
            <div class="layui-input-block">
                <textarea name="reason" placeholder="请详细说明转单原因，以便接收科室了解情况" class="layui-textarea" lay-verify="required"></textarea>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="layui-form-item" style="text-align: center; margin-top: 30px;">
            <button class="layui-btn layui-btn-normal" lay-submit lay-filter="submitTransfer">确认转单</button>
            <button type="button" class="layui-btn layui-btn-primary" onclick="closeModal()">取消</button>
        </div>
    </form>
</div>

<script src="/static/layui/layui.js"></script>
<script>
    layui.use(['form', 'layer', 'jquery'], function(){
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;

        // 关闭弹窗函数
        window.closeModal = function(){
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        };

        // 监听提交
        form.on('submit(submitTransfer)', function(data){
            var field = data.field;
            
            // 简单确认
            layer.confirm('确定要将该工单转交给其他科室吗？转单后需对方重新派单。', {icon: 3, title:'提示'}, function(index){
                layer.close(index);
                
                var loadIndex = layer.load(2);
                $.post('/orders/api/transfer_confirm', field, function(res){
                    layer.close(loadIndex);
                    if(res.code === 0){
                        layer.msg('转单成功', {icon: 1, time: 1000}, function(){
                            // 关闭弹窗并刷新父页面表格
                            var parentIndex = parent.layer.getFrameIndex(window.name); 
                            parent.layer.close(parentIndex);
                            if(parent.table){
                                parent.table.reload('ordersTable'); 
                            } else {
                                parent.location.reload();
                            }
                        });
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }).fail(function(){
                    layer.close(loadIndex);
                    layer.msg('网络错误', {icon: 2});
                });
            });
            return false; // 阻止表单默认提交
        });
    });
</script>
</body>
</html>
