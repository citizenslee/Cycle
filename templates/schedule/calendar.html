<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能排班管理系统</title>
    <!-- 引入 Layui -->
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <!-- 引入 Google Fonts (可选，增加数字美感) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 核心色板 */
            --primary-color: #4f46e5; /* 靛蓝 */
            --primary-hover: #4338ca;
            --secondary-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border-light: #e2e8f0;
            
            /* 阴影体系 */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            background-color: #f1f5f9; 
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        .main-container { padding: 30px; max-width: 1600px; margin: 0 auto; }

        /* === 1. 顶部工具栏 (Glassy Effect) === */
        .toolbar-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 16px;
            padding: 16px 30px;
            box-shadow: var(--shadow-md);
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
            position: sticky; top: 10px; z-index: 100; /* 吸顶效果 */
        }

        .date-control { display: flex; align-items: center; gap: 15px; }
        .date-title { 
            font-size: 24px; font-weight: 800; color: var(--text-main); 
            letter-spacing: -0.5px; margin: 0 10px; min-width: 180px; text-align: center;
        }
        
        .dept-badge { 
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 16px; background: #eff6ff; color: var(--primary-color); 
            border-radius: 50px; font-size: 13px; font-weight: 600; 
            border: 1px solid #dbeafe;
        }

        /* 按钮重写 */
        .layui-btn-group .layui-btn {
            background: #fff; border: 1px solid var(--border-light); color: var(--text-main);
            border-radius: 8px; margin: 0 2px; height: 36px; line-height: 36px;
            font-weight: 500; transition: all 0.2s;
        }
        .layui-btn-group .layui-btn:first-child { border-radius: 8px 0 0 8px; }
        .layui-btn-group .layui-btn:last-child { border-radius: 0 8px 8px 0; }
        .layui-btn-group .layui-btn:hover { color: var(--primary-color); background: #f8fafc; border-color: #cbd5e1; }

        /* 智能生成按钮 */
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none; border-radius: 8px; height: 38px; line-height: 38px;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.25);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 6px 10px rgba(79, 70, 229, 0.3); opacity: 0.95; }

        /* === 2. 日历容器 === */
        .calendar-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            min-height: 700px;
        }

        .cal-header { 
            display: grid; grid-template-columns: repeat(7, 1fr); 
            margin-bottom: 16px; padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
        }
        .cal-th { 
            text-align: center; font-weight: 700; color: #94a3b8; 
            text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
        }
        .cal-th.weekend { color: #f43f5e; }

        #calendarGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }

        /* === 3. 班次格子样式 === */
        .cal-cell {
            background: #fff; 
            border: 1px solid transparent; /* 预留边框位置 */
            border-radius: 12px;
            min-height: 150px; 
            padding: 12px; 
            display: flex; flex-direction: column;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(to bottom right, #ffffff, #fafafa);
        }
        /* 格子悬停 */
        .cal-cell:hover { 
            box-shadow: var(--shadow-lg); 
            transform: translateY(-4px); 
            z-index: 10; 
            border-color: #e2e8f0;
        }
        
        /* 日期数字 */
        .cal-date-num {
            align-self: flex-end;
            font-size: 16px; font-weight: 600; color: #cbd5e1;
            margin-bottom: 8px; width: 28px; height: 28px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        /* 今天的高亮样式 (需要在JS或后端渲染时加上 class='today') */
        .cal-cell.today .cal-date-num { background: var(--primary-color); color: #fff; box-shadow: 0 2px 4px rgba(79,70,229,0.3); }

        /* === 4. 班次条目 (Chips Design) === */
        .shift-item {
            margin-top: 6px; padding: 8px 10px; 
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; 
            transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        /* 左侧彩色条装饰 */
        .shift-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--primary-color);
        }
        
        /* 不同班次的颜色区分 (示例：根据班次名称的首字母或JS添加类名) */
        .shift-item[data-shiftname*="早"]::before { background: #10b981; } /* 绿色 */
        .shift-item[data-shiftname*="晚"]::before { background: #6366f1; } /* 蓝紫 */
        .shift-item[data-shiftname*="夜"]::before { background: #3b82f6; } /* 蓝色 */
        .shift-item[data-shiftname*="休"]::before { background: #94a3b8; } /* 灰色 */

        .shift-item:hover { 
            border-color: var(--primary-color); 
            background: #f5f3ff;
            transform: translateX(2px);
        }
        
        .shift-header { 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; 
            text-transform: uppercase;
        }
        .shift-users { 
            color: var(--text-main); font-weight: 600; font-size: 13px; 
            line-height: 1.4; 
            display: flex; flex-wrap: wrap; gap: 4px;
        }
        /* 名字小标签 */
        .user-tag { background: rgba(0,0,0,0.03); padding: 0 4px; border-radius: 4px; }

        /* === 5. Layui 表单美化 === */
        .layui-form-select .layui-input {
            border-radius: 8px; border-color: #e2e8f0; height: 38px;
            box-shadow: none;
        }
        .layui-form-select .layui-input:focus { border-color: var(--primary-color) !important; }
        .layui-form-select dl { border-radius: 8px; border: none; box-shadow: var(--shadow-lg); padding: 5px 0; }
        .layui-form-select dl dd.layui-this { background-color: var(--primary-color); }
        
        /* === 6. 弹窗样式重写 === */
        .custom-layer-skin .layui-layer-title {
            background: #fff; border-bottom: none; padding-top: 20px; font-size: 18px; font-weight: bold;
        }
        .custom-layer-skin .layui-layer-content { padding-top: 0; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 1. 顶部栏 -->
    <div class="toolbar-card">
        <div class="date-control">
            <div class="layui-btn-group">
                <button class="layui-btn layui-btn-primary layui-btn-sm" onclick="app.changeMonth(-1)">
                    <i class="layui-icon layui-icon-left"></i>
                </button>
                <button class="layui-btn layui-btn-primary layui-btn-sm" onclick="app.changeMonth(0)">
                    本月
                </button>
                <button class="layui-btn layui-btn-primary layui-btn-sm" onclick="app.changeMonth(1)">
                    <i class="layui-icon layui-icon-right"></i>
                </button>
            </div>
            
            <div class="date-title" id="displayDate">Loading...</div>
            <div class="dept-badge"><i class="layui-icon layui-icon-home" style="font-size: 12px;"></i> {{ dept_name }}</div>
        </div>

        <div class="layui-form" style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 160px;">
                <select id="startUserSelect">
                    <option value="">🔄 智能顺延上月</option>
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="layui-btn btn-gradient" id="btnAutoSchedule">
                <i class="layui-icon layui-icon-engine"></i> 一键智能排班
            </button>
        </div>
    </div>

    <!-- 2. 日历网格 -->
    <div class="calendar-card">
        <div class="cal-header">
            <div class="cal-th">MON 周一</div><div class="cal-th">TUE 周二</div><div class="cal-th">WED 周三</div>
            <div class="cal-th">THU 周四</div><div class="cal-th">FRI 周五</div>
            <div class="cal-th weekend">SAT 周六</div><div class="cal-th weekend">SUN 周日</div>
        </div>
        <div id="calendarGrid"></div>
    </div>
</div>

<!-- 隐藏域 -->
<input type="hidden" id="hdnYear" value="{{ default_year }}">
<input type="hidden" id="hdnMonth" value="{{ default_month }}">

<!-- 模板：下拉框数据 -->
<script type="text/html" id="staffData">
    {% for u in users %}
    <option value="{{ u.id }}">{{ u.username }}</option>
    {% endfor %}
</script>

<script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
<script>
layui.use(['layer', 'form', 'element', 'jquery'], function(){
    var layer = layui.layer,
        form = layui.form,
        element = layui.element,
        $ = layui.jquery;

    // --- 应用逻辑 ---
    window.app = {
        year: parseInt($('#hdnYear').val()),
        month: parseInt($('#hdnMonth').val()),

        init: function() {
            this.loadCalendar();
            this.bindGlobalEvents();
        },

        loadCalendar: function() {
            var _this = this;
            var idx = layer.load(2, {shade:0.01}); // 这里的loading也可以美化，暂时保留默认
            $.get('/schedule/api/get_calendar_html', {year: _this.year, month: _this.month}, function(html){
                layer.close(idx);
                // 渲染后添加淡入动画
                $('#calendarGrid').html(html).css('opacity', 0).animate({opacity: 1}, 400);
                
                // 格式化日期标题
                $('#displayDate').text(_this.year + '年 ' + String(_this.month).padStart(2,'0') + '月');
                $('#hdnYear').val(_this.year);
                $('#hdnMonth').val(_this.month);

                // --- 增强渲染：给今天的格子加高亮 (纯JS前端逻辑) ---
                var today = new Date();
                if(today.getFullYear() === _this.year && (today.getMonth()+1) === _this.month) {
                    // 假设你的后端HTML里，cell有data-day属性或者我们根据文本查找
                    // 这是一个通用的查找逻辑，如果没有特定属性，可能需要后端配合。
                    // 这里仅做示例，如果不生效不影响功能
                }

            }).fail(function(){ layer.close(idx); layer.msg('加载数据失败', {icon: 2, anim: 6}); });
        },

        changeMonth: function(step) {
            if(step===0) {
                var now = new Date(); this.year = now.getFullYear(); this.month = now.getMonth()+1;
            } else {
                this.month += step;
                if(this.month > 12) { this.month=1; this.year++; }
                if(this.month < 1) { this.month=12; this.year--; }
            }
            this.loadCalendar();
        },

        bindGlobalEvents: function() {
            var _this = this;

            // 1. 智能排班
            $('#btnAutoSchedule').on('click', function(){
                var startUser = $('#startUserSelect').val();
                layer.confirm(`
                    <div style="text-align:center; padding:10px;">
                        <i class="layui-icon layui-icon-tips" style="font-size:40px; color:#f59e0b;"></i>
                        <h3 style="margin:10px 0;">确认重新生成?</h3>
                        <p style="color:#666;">${_this.year}年${_this.month}月 的当前数据将被覆盖</p>
                    </div>
                `, {
                    title: false, 
                    btn: ['确定生成', '取消'],
                    btnAlign: 'c',
                    closeBtn: 0,
                    skin: 'custom-layer-skin' // 需要自己在CSS定义或忽略
                }, function(index){
                    layer.close(index);
                    var loadIdx = layer.msg('智能算法计算中...', {icon:16, shade:0.3, time:0});
                    $.ajax({
                        url: '/schedule/api/auto_schedule',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({year: _this.year, month: _this.month, start_user_id: startUser}),
                        success: function(res){
                            layer.close(loadIdx);
                            if(res.success){ layer.msg('排班完成', {icon:1}); _this.loadCalendar(); }
                            else { layer.alert(res.msg, {icon:2}); }
                        }
                    });
                });
            });

            // 2. 班次点击 - 弹窗
            $(document).on('click', '.shift-item', function(){
                var $this = $(this);
                var date = $this.data('date');
                var shiftId = $this.data('shiftid');
                var shiftName = $this.data('shiftname');
                
                var rawUsers = $this.attr('data-users');
                var currentUsers = [];
                try { currentUsers = rawUsers ? JSON.parse(rawUsers) : []; } catch(e){}

                var allowRest = currentUsers.length > 1;
                // 构建美化后的Badge
                var restTip = allowRest ? "" : " <span class='layui-badge layui-bg-gray' style='border-radius:4px;'>单人</span>";

                var currentUserOpts = '<option value="">请选择人员</option>';
                $.each(currentUsers, function(i, u){
                    currentUserOpts += `<option value="${u.uid}">${u.name}</option>`;
                });

                var staffOpts = $('#staffData').html().trim(); 

                // --- 弹窗内容 (增加了一些padding和图标) ---
                var contentHtml = `
                    <div style="padding: 15px 25px;">
                        <div class="layui-tab layui-tab-brief" lay-filter="optTab">
                            <ul class="layui-tab-title" style="text-align:center;">
                                <li class="layui-this">替班</li>
                                <li class="${allowRest ? '' : 'layui-disabled'}">休息${restTip}</li>
                                <li>加人</li>
                            </ul>
                            <div class="layui-tab-content">
                                
                                <!-- Tab 1: 替班 -->
                                <div class="layui-tab-item layui-show">
                                    <blockquote class="layui-elem-quote" style="border-left: 5px solid var(--primary-color); background:#f8fafc; font-size:12px; margin-top:10px;">
                                        将当前值班人员替换为其他人。
                                    </blockquote>
                                    <form class="layui-form" lay-filter="swapForm" style="margin-top:20px;">
                                        <input type="hidden" name="roster_date" value="${date}">
                                        <input type="hidden" name="shift_id" value="${shiftId}">
                                        <div class="layui-form-item">
                                            <select name="old_user_id" lay-verify="required">${currentUserOpts}</select>
                                        </div>
                                        <div style="text-align:center; color:#ccc; margin:-10px 0 10px;"><i class="layui-icon layui-icon-down"></i></div>
                                        <div class="layui-form-item">
                                            <select name="new_user_id" lay-verify="required" lay-search>
                                                <option value="">选择替班人(支持搜索)...</option>
                                                ${staffOpts}
                                            </select>
                                        </div>
                                        <button class="layui-btn layui-btn-fluid btn-gradient" lay-submit lay-filter="doSwap" style="margin-top:15px;">确认调整</button>
                                    </form>
                                </div>
                                
                                <!-- Tab 2: 休息 -->
                                <div class="layui-tab-item">
                                    ${allowRest ? `
                                    <div class="layui-text" style="color:#f59e0b; margin-bottom:15px; text-align:center;">
                                        <i class="layui-icon layui-icon-tips"></i> 移除后该班次人数将减少
                                    </div>
                                    <form class="layui-form" lay-filter="restForm">
                                        <input type="hidden" name="roster_date" value="${date}">
                                        <input type="hidden" name="shift_id" value="${shiftId}">
                                        <div class="layui-form-item">
                                            <select name="user_id" lay-verify="required">${currentUserOpts}</select>
                                        </div>
                                        <button class="layui-btn layui-btn-fluid layui-btn-danger" lay-submit lay-filter="doRest" style="border-radius:8px;">确认休息</button>
                                    </form>
                                    ` : `<div style="text-align:center; padding:40px 0; color:#cbd5e1;">
                                            <i class="layui-icon layui-icon-user" style="font-size:48px;"></i>
                                            <p style="margin-top:10px;">最少需保留一人值班</p>
                                         </div>`}
                                </div>

                                <!-- Tab 3: 加人 -->
                                <div class="layui-tab-item">
                                    <div class="layui-text" style="color:#10b981; margin-bottom:15px; text-align:center;">
                                        <i class="layui-icon layui-icon-add-circle"></i> 增加额外人手
                                    </div>
                                    <form class="layui-form" lay-filter="addForm">
                                        <input type="hidden" name="roster_date" value="${date}">
                                        <input type="hidden" name="shift_id" value="${shiftId}">
                                        <div class="layui-form-item">
                                            <select name="user_id" lay-verify="required" lay-search>
                                                <option value="">搜索添加人员...</option>
                                                ${staffOpts}
                                            </select>
                                        </div>
                                        <button class="layui-btn layui-btn-fluid" style="background:#10b981; border-radius:8px;" lay-submit lay-filter="doAdd">确认添加</button>
                                    </form>
                                </div>

                            </div>
                        </div>
                    </div>
                `;

                layer.open({
                    type: 1,
                    title: `<span style="color:#333;">${date} · ${shiftName}管理</span>`,
                    area: ['420px', '520px'], // 稍微调窄一点，更精致
                    content: contentHtml,
                    shadeClose: true,
                    skin: 'custom-layer-skin',
                    success: function(layero, index){
                        form.render();
                        element.render('tab');
                        
                        // Tab 切换校验逻辑保持不变
                        element.on('tab(optTab)', function(data){
                            if(data.index === 1 && !allowRest){
                                layer.msg('单人值班，无法执行休息操作', {icon:0, time:1500});
                                element.tabChange('optTab', 0);
                            }
                        });

                        // AJAX 提交封装
                        var submitData = function(url, fieldData, confirmMsg) {
                            var doAjax = function() {
                                var loadIdx = layer.load(2, {shade: 0.1});
                                $.ajax({
                                    url: url, type: 'POST', contentType: 'application/json',
                                    data: JSON.stringify(fieldData),
                                    success: function(res){
                                        layer.close(loadIdx);
                                        if(res.success){ 
                                            layer.close(index); 
                                            layer.msg('操作成功', {icon:1, time:800}); 
                                            _this.loadCalendar(); 
                                        }
                                        else { layer.msg(res.msg, {icon:2, anim:6}); }
                                    },
                                    error: function(){ layer.close(loadIdx); layer.msg('服务器网络错误', {icon:2}); }
                                });
                            };
                            if(confirmMsg) layer.confirm(confirmMsg, {icon:3, title:'二次确认'}, function(i){ layer.close(i); doAjax(); });
                            else doAjax();
                        };

                        form.on('submit(doSwap)', function(data){ submitData('/schedule/api/substitute', data.field); return false; });
                        form.on('submit(doRest)', function(data){ submitData('/schedule/api/rest', data.field, '确定将该员工移除出今日班次吗？'); return false; });
                        form.on('submit(doAdd)', function(data){ submitData('/schedule/api/add_staff', data.field); return false; });
                    }
                });
            });
        }
    };

    app.init();
});
</script>
</body>
</html>
