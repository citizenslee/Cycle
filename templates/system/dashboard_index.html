<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>系统管理首页</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
  
  <style>
    body { background-color: #f2f2f2; padding: 15px; }
    
    /* === 卡片通用样式 === */
    .dashboard-card {
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 8px; /* 圆角稍微大一点 */
        text-align: center;
        border: 1px solid #e6e6e6;
    }
    .dashboard-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        border-color: #1E9FFF; /* 悬停时边框变蓝 */
    }
    .dashboard-card .layui-card-header {
        font-weight: 600;
        font-size: 16px;
        border-bottom: 1px solid #f0f0f0;
        color: #333;
    }
    .dashboard-card .layui-card-body {
        padding: 30px 10px;
        color: #888;
    }
    
    /* 图标通用样式 */
    .card-icon {
        font-size: 48px; /* 稍微加大 */
        display: inline-block;
        margin-bottom: 15px;
        transition: transform 0.3s;
        /* 增加一点阴影让图标浮起来 */
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    /* 悬停时图标微动 */
    .dashboard-card:hover .card-icon {
        transform: scale(1.1); 
    }
    
    .card-desc {
        font-size: 13px;
        color: #999;
        margin-top: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* 分类标题样式 */
    .section-title {
        margin: 20px 0 15px 5px;
        font-size: 18px;
        font-weight: 500;
        color: #333;
        border-left: 5px solid #1E9FFF;
        padding-left: 12px;
        line-height: 1.2;
    }

    /* === 配色方案 (Semantic Colors) === */
    /* 1. 机构 - 蓝色 (稳重、官方) */
    .c-hospital { color: #1E9FFF; } 
    /* 2. 科室 - 青色/蓝绿色 (分支、生长) */
    .c-dept     { color: #009688; }
    /* 3. 用户 - 紫色 (高贵、管理) */
    .c-user     { color: #9C27B0; }
    /* 4. 设备 - 橙色 (硬件、警示) */
    .c-device   { color: #FF9800; }
    /* 5. 数据 - 深灰/藏青 (底层、核心) */
    .c-system   { color: #393D49; }

  </style>
</head>
<body>

<div class="layui-fluid">

  <!-- ======================= 模块 1: 权限管理 ======================= -->
  <div class="section-title">权限与组织架构</div>
  <div class="layui-row layui-col-space15">
    
    <!-- 4101: 机构管理 -->
    <div class="layui-col-md3 layui-col-sm6">
      <div class="layui-card dashboard-card" data-id="4101">
        <div class="layui-card-header">机构管理</div>
        <div class="layui-card-body">
          <!-- 图标：home (代表大楼/主基地) -->
          <i class="layui-icon layui-icon-home card-icon c-hospital"></i>
          <p class="card-desc">管理医院及下属院区信息</p>
        </div>
      </div>
    </div>

    <!-- 4102: 科室管理 -->
    <div class="layui-col-md3 layui-col-sm6">
      <div class="layui-card dashboard-card" data-id="4102">
        <div class="layui-card-header">科室管理</div>
        <div class="layui-card-body">
          <!-- 图标：app (代表应用网格/分支结构) 或 template-1 -->
          <i class="layui-icon layui-icon-app card-icon c-dept"></i>
          <p class="card-desc">配置科室及组织架构</p>
        </div>
      </div>
    </div>

    <!-- 4103: 用户管理 -->
    <div class="layui-col-md3 layui-col-sm6">
      <div class="layui-card dashboard-card" data-id="4103">
        <div class="layui-card-header">用户管理</div>
        <div class="layui-card-body">
          <!-- 图标：group (代表多用户/群组) -->
          <i class="layui-icon layui-icon-group card-icon c-user"></i>
          <p class="card-desc">账号创建、角色与权限分配</p>
        </div>
      </div>
    </div>

    <!-- 4104: 登录设备绑定 -->
    <div class="layui-col-md3 layui-col-sm6">
      <div class="layui-card dashboard-card" data-id="4104">
        <div class="layui-card-header">设备绑定</div>
        <div class="layui-card-body">
          <!-- 图标：cellphone (代表移动设备) -->
          <i class="layui-icon layui-icon-cellphone card-icon c-device"></i>
          <p class="card-desc">查看及解绑登录设备ID</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ======================= 模块 2: 系统数据 ======================= -->
  <div class="section-title" style="margin-top: 30px;">系统运维</div>
  <div class="layui-row layui-col-space15">
    
    <!-- 4201: 系统数据 -->
    <div class="layui-col-md3 layui-col-sm6">
      <div class="layui-card dashboard-card" data-id="4201">
        <div class="layui-card-header">系统数据</div>
        <div class="layui-card-body">
          <!-- 图标：console (代表控制台) 或 engine (引擎) -->
          <i class="layui-icon layui-icon-console card-icon c-system"></i>
          <p class="card-desc">查看系统日志与运行参数</p>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- 引入 layui.js -->
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['jquery'], function(){
  var $ = layui.jquery;

  // 监听卡片点击事件
  $('.dashboard-card').on('click', function(){
    var id = $(this).attr('data-id');
    
    if(window.parent && window.parent.layui){
        var $parent = window.parent.layui.jquery;
        var $menuItem = $parent('.site-menu-active[data-id="'+ id +'"]');
        
        if($menuItem.length > 0){
            $menuItem.click();
        } else {
            console.error('在父级菜单中未找到 ID 为 ' + id + ' 的菜单项');
            layer.msg('无法定位菜单项，请检查权限');
        }
    } else {
        layer.msg('非 Iframe 环境无法打开 Tab');
    }
  });
});
</script>

</body>
</html>
